# CasaVue configuration file

# appearance settings
customization:

  # influences page title and PWA name
  name: CasaVue

  # Logo overrides as base64 encoded SVG documents, e.g. `base64 -w0 logo.svg`.
  # The color "#000000" of the SVG is repainted with the theme contrast color, so an
  # override should use it too. Overriding only "logo" also changes the favicons,
  # which are then generated from the overriding logo, and "logo" replaces the logo in
  # the header of the dashboard as well. An override is drawn 30% smaller than its
  # viewBox before its icons are generated, because own SVGs usually fill the canvas
  # edge to edge; an SVG without a viewBox keeps its size.
  # logo: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmci...   # <svg ...>
  #
  # overrides only the small logo used for the favicons
  # logo_small: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmci...   # <svg ...>

  colors:
    # main color
    theme: "#deaded"

    # color settings for dashboard items
    items:
      # range: 0 <-> 100
      saturation: 8

      # range: -1 <-> 100
      # set lightness to -1 to use browser theme setting
      lightness: 84

# including or excluding items or namespaces by regex
content_filters:

  namespace:
    
    # possible values: "include", "exclude"
    mode: "include"
      
    # Go regexp syntax compatible (https://pkg.go.dev/regexp/syntax)
    # catches all values by default
    pattern: "^.*$"

  item:

    # possible values: "include", "exclude", "ingressAnnotation"
    # "ingressAnnotation" mode disables item regex pattern, and includes only 
    # ingress resources with casavue.app/enable=true annotation
    mode: "include"

    # Go regexp syntax compatible (https://pkg.go.dev/regexp/syntax)
    # catches all values by default
    pattern: "^.*$"
    
# Allows connections to servers with an invalid TLS certificate
# Don't turn it on unless you know what you're doing
allow_skip_tls_verify: false

logging:

  # possible levels: "debug", "info", "warn", "error"
  level: "info"
