# CasaVue configuration file

# appearance settings
customization:

  # influences page title and PWA name
  name: CasaVue

  # Logo override as a base64 encoded SVG document, e.g. `base64 -w0 logo.svg`. It is
  # the source of the favicons and of all the PWA icons, and it replaces the logo in
  # the header of the dashboard. The color "#000000" of the SVG is repainted with the
  # theme contrast color, so an override should use it too. An override is drawn 30%
  # smaller than its viewBox before its icons are generated, because own SVGs usually
  # fill the canvas edge to edge; an SVG without a viewBox keeps its size.
  # logo: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmci...   # <svg ...>

  colors:
    # main color
    theme: "#deaded"

    # color settings for dashboard items
    items:
      # range: 0 <-> 100
      saturation: 8

      # range: -1 <-> 100
      # set lightness to -1 to use browser theme setting
      lightness: 84

# including or excluding items or namespaces by regex
content_filters:

  namespace:
    
    # possible values: "include", "exclude"
    mode: "include"
      
    # Go regexp syntax compatible (https://pkg.go.dev/regexp/syntax)
    # catches all values by default
    # newlines and spaces of the value are ignored, so a long pattern can be written
    # over several lines
    pattern: "^.*$"

  item:

    # possible values: "include", "exclude", "ingressAnnotation"
    # "ingressAnnotation" mode disables item regex pattern, and includes only 
    # ingress resources with casavue.app/enable=true annotation
    mode: "include"

    # Go regexp syntax compatible (https://pkg.go.dev/regexp/syntax)
    # catches all values by default
    # newlines and spaces of the value are ignored, so a long pattern can be written
    # over several lines
    pattern: "^.*$"
    
# Allows connections to servers with an invalid TLS certificate
# Don't turn it on unless you know what you're doing
allow_skip_tls_verify: false

logging:

  # possible levels: "debug", "info", "warn", "error"
  level: "info"
