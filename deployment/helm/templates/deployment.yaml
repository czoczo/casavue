apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "casavue.fullname" . }}
  labels:
    {{- include "casavue.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "casavue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "casavue.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "casavue.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.image.tag }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}-distroless"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
          # the whole configuration directory: the kubelet updates the files of a
          # ConfigMap volume in place, which it never does for a subPath mount
          - mountPath: /app/config
            name: casavue-cfg
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # both configuration ConfigMaps in one directory. config.main is not set by
        # default, so its ConfigMap does not have to exist; when it is created later,
        # the kubelet adds its file
        - name: casavue-cfg
          projected:
            sources:
              - configMap:
                  name: casavue-cfg-main
                  optional: true
              - configMap:
                  name: casavue-cfg-items
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
