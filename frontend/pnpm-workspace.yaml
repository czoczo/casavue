# pnpm >= 10 blocks dependency lifecycle scripts (postinstall/install) unless
# they are explicitly approved. Without this file `pnpm install` fails with
# ERR_PNPM_IGNORED_BUILDS. Approve the packages used by this project below
# (equivalent to picking them in `pnpm approve-builds`).
allowBuilds:
  '@fortawesome/fontawesome-common-types': true
  '@fortawesome/fontawesome-svg-core': true
  '@fortawesome/free-solid-svg-icons': true
  core-js: true
  yorkie: true
